  <circle cx="150" cy="11.5" r="4.2" stroke="#8C6239" stroke-width="0.7" opacity="0.85"/>
  <circle cx="150" cy="11.5" r="2.2" stroke="#C84B31" stroke-width="0.5" opacity="0.65"/>
  <circle cx="150" cy="11.5" r="0.9" fill="#C84B31"/>
  <!-- Tangent wrap around -->
  <line x1="154.2" y1="11.5" x2="160" y2="11.5" stroke="#8C6239" stroke-width="0.6" opacity="0.6"/>
  <line x1="0" y1="11.5" x2="5.8" y2="11.5" stroke="#8C6239" stroke-width="0.6" opacity="0.6"/>

  <!-- Bottom Border Rule -->
  <line x1="0" y1="17" x2="160" y2="17" stroke="#8C6239" stroke-width="0.8" opacity="0.6"/>
